name: Windows build

on:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: proxima-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build the renderer
        run: npm run build
      - name: Stamp a CI prerelease when this build is not newer than v0.4.0
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Test-VersionNewer([string]$Candidate, [string]$Baseline) {
            function Get-Parts([string]$Text) {
              if ($Text -notmatch '^(\d+)\.(\d+)\.(\d+)(?:[-+]([0-9A-Za-z.-]+))?$') {
                throw "Not a Proxima version: '$Text'"
              }
              [pscustomobject]@{ Major = [int]$Matches[1]; Minor = [int]$Matches[2]; Patch = [int]$Matches[3]; Pre = $Matches[4] }
            }
            $next = Get-Parts $Candidate
            $prev = Get-Parts $Baseline
            if ($next.Major -ne $prev.Major) { return $next.Major -gt $prev.Major }
            if ($next.Minor -ne $prev.Minor) { return $next.Minor -gt $prev.Minor }
            if ($next.Patch -ne $prev.Patch) { return $next.Patch -gt $prev.Patch }
            if (-not $prev.Pre -and $next.Pre) { return $false }
            if ($prev.Pre -and -not $next.Pre) { return $true }
            if (-not $next.Pre -and -not $prev.Pre) { return $false }
            return [string]::Compare($next.Pre, $prev.Pre, [StringComparison]::Ordinal) -gt 0
          }
          $pkg = Get-Content -Raw package.json | ConvertFrom-Json
          if (Test-VersionNewer $pkg.version '0.4.0') {
            Write-Host "package.json $($pkg.version) is already newer than 0.4.0. Leaving it."
            exit 0
          }
          $stamped = "0.4.1-ci.$($env:GITHUB_RUN_ID)"
          $raw = Get-Content -Raw package.json
          $updated = [regex]::Replace($raw, '("version"\s*:\s*")[^"]+"', "`${1}$stamped`"", 1)
          if ($updated -eq $raw) { throw 'Could not stamp package.json version' }
          Set-Content -Path package.json -Value $updated -NoNewline
          Write-Host "Stamped installer version $stamped so the self-update test is newer than published v0.4.0. This file is not committed. Tag builds are not stamped."
      - name: Package the Windows app
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload the executables
        uses: actions/upload-artifact@v4
        with:
          name: proxima-windows
          path: release/*.exe
          if-no-files-found: error
  verify-uninstall:
    name: Install / uninstall leaves no trace
    needs: windows
    runs-on: windows-latest
    steps:
      - name: Download the executables
        uses: actions/download-artifact@v4
        with:
          name: proxima-windows
          path: release
      - name: Silent install, then silent uninstall, then check for leftovers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem release\Proxima-Setup-*.exe | Select-Object -First 1).FullName
          Write-Host "Installer: $setup"

          $installDir   = Join-Path $env:LOCALAPPDATA 'Programs\Proxima'
          $appData      = Join-Path $env:APPDATA 'Proxima'
          $desktopLnk   = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Proxima.lnk'
          $startMenuLnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'Proxima.lnk'
          $uninstallRoot = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall'

          function Get-UninstallEntries {
            Get-ChildItem $uninstallRoot -ErrorAction SilentlyContinue |
              Where-Object { (Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue).DisplayName -like 'Proxima*' }
          }

          # ---- install ----
          $p = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          Write-Host "Installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Installer failed with exit code $($p.ExitCode)" }

          $entry = Get-UninstallEntries | Select-Object -First 1
          if (-not $entry) { throw 'No HKCU uninstall entry for Proxima after install' }
          $guid = $entry.PSChildName
          $props = Get-ItemProperty $entry.PSPath
          Write-Host "Uninstall entry: $($entry.Name)"
          Write-Host "InstallLocation: $($props.InstallLocation)"
          if ($props.InstallLocation) { $installDir = $props.InstallLocation.TrimEnd('\') }
          $softwareKeys = @("HKCU:\Software\$guid", 'HKCU:\Software\com.jasonvgriffin.proxima', 'HKCU:\Software\Proxima')

          $missing = @()
          foreach ($path in @($installDir, (Join-Path $installDir 'Proxima.exe'), (Join-Path $installDir 'Uninstall Proxima.exe'), $desktopLnk, $startMenuLnk)) {
            if (-not (Test-Path -LiteralPath $path)) { $missing += $path }
          }
          if ($missing) { throw "Missing after install:`n  $($missing -join "`n  ")" }
          Write-Host 'Install folder, shortcuts and uninstall entry all present.'

          # ---- create user data ----
          $app = Start-Process -FilePath (Join-Path $installDir 'Proxima.exe') -PassThru
          Start-Sleep -Seconds 10
          Get-Process -Name 'Proxima' -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          New-Item -ItemType Directory -Force -Path (Join-Path $appData 'saves') | Out-Null
          Set-Content -Path (Join-Path $appData 'saves\slot-1.json') -Value '{"fake":true}'
          New-Item -ItemType Directory -Force -Path (Join-Path $env:LOCALAPPDATA 'Proxima\Crashpad') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $env:LOCALAPPDATA 'proxima-updater\pending') | Out-Null
          $tempUpdates = Join-Path $env:TEMP 'Proxima\updates'
          New-Item -ItemType Directory -Force -Path $tempUpdates | Out-Null
          Set-Content -Path (Join-Path $tempUpdates 'apply-update.ps1') -Value 'leftover helper'
          Set-Content -Path (Join-Path $tempUpdates 'Proxima-Setup-leftover.exe') -Value 'leftover installer'
          New-Item -Force -Path 'HKCU:\Software\com.jasonvgriffin.proxima' | Out-Null
          New-Item -Force -Path 'HKCU:\Software\Proxima' | Out-Null
          Write-Host 'User data before uninstall:'
          Get-ChildItem -Recurse -Force $appData | ForEach-Object { Write-Host "  $($_.FullName)" }

          # ---- uninstall ----
          $uninstaller = Join-Path $installDir 'Uninstall Proxima.exe'
          Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait | Out-Null
          # The NSIS uninstaller re-launches itself from %TEMP%, so poll.
          $deadline = (Get-Date).AddSeconds(180)
          while ((Get-Date) -lt $deadline) {
            if (-not (Test-Path -LiteralPath $installDir) -and -not (Get-UninstallEntries)) { break }
            Start-Sleep -Seconds 2
          }
          # Let the temp copy of the uninstaller finish its last steps.
          $deadline2 = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline2 -and (Get-Process | Where-Object { $_.Name -like 'Un_*' -or $_.Name -like 'Au_*' })) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 3

          # ---- assert ----
          $leftovers = @()
          foreach ($path in @($installDir, $appData, $desktopLnk, $startMenuLnk, (Join-Path $env:APPDATA 'com.jasonvgriffin.proxima'), (Join-Path $env:TEMP 'Proxima'))) {
            if (Test-Path -LiteralPath $path) { $leftovers += $path }
          }
          Get-ChildItem -Force -Path $env:LOCALAPPDATA -Filter 'Proxima*' -ErrorAction SilentlyContinue | ForEach-Object { $leftovers += $_.FullName }
          Get-ChildItem -Force -Path $env:LOCALAPPDATA -Filter 'com.jasonvgriffin.proxima*' -ErrorAction SilentlyContinue | ForEach-Object { $leftovers += $_.FullName }
          Get-ChildItem -Force -Path ([Environment]::GetFolderPath('Programs')) -Filter 'Proxima*' -ErrorAction SilentlyContinue | ForEach-Object { $leftovers += $_.FullName }
          Get-ChildItem -Force -Path ([Environment]::GetFolderPath('Desktop')) -Filter 'Proxima*' -ErrorAction SilentlyContinue | ForEach-Object { $leftovers += $_.FullName }
          foreach ($e in @(Get-UninstallEntries)) { $leftovers += $e.Name }
          if (Test-Path "$uninstallRoot\$guid") { $leftovers += "$uninstallRoot\$guid" }
          foreach ($k in $softwareKeys) { if (Test-Path $k) { $leftovers += $k } }
          $leftovers = $leftovers | Sort-Object -Unique

          if ($leftovers) {
            Write-Host '::error::Uninstall left traces behind:'
            $leftovers | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host 'Uninstall left nothing behind. Confirmed removed:'
          @($installDir, $appData, "$env:LOCALAPPDATA\Proxima*", "$env:LOCALAPPDATA\proxima-updater", $desktopLnk, $startMenuLnk, "$uninstallRoot\$guid") + $softwareKeys |
            ForEach-Object { Write-Host "  $_" }

  verify-upgrade:
    name: In-place upgrade keeps saves
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the new executables
        uses: actions/download-artifact@v4
        with:
          name: proxima-windows
          path: release
      - name: Install v0.4.0, then self-update with the helper
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\.github\scripts\verify-upgrade.ps1

  publish:
    name: Publish GitHub Release
    needs: [windows, verify-uninstall, verify-upgrade]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the executables
        uses: actions/download-artifact@v4
        with:
          name: proxima-windows
          path: release
      - name: Create a new release without replacing an existing one
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Error "Tag $tag is not a vX.Y.Z release tag."
            exit 1
          }
          if ($tag -ne "v$version") {
            Write-Error "Tag $tag does not match package.json version $version. Refusing to publish."
            exit 1
          }
          $ErrorActionPreference = 'Continue'
          gh release view $tag --json tagName 1>$null 2>$null
          $exists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = 'Stop'
          if ($exists) {
            Write-Error "Release $tag already exists. Proxima will not replace it."
            exit 1
          }
          $notes = @(
            "Proxima $version"
            ''
            "Unsigned Windows installer (Proxima-Setup-$version.exe) and portable build (Proxima-Portable-$version.exe)."
            'If SmartScreen warns, see the README.'
            "This release was created from the $tag tag. Older releases, including v0.1.0-test, are left as they are."
          ) -join "`n"
          gh release create $tag --title "Proxima $version" --notes $notes (Get-ChildItem release\*.exe).FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
